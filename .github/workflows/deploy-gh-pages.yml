name: Deploy Markdown Book to GitHub Pages

on:
  push:
    branches:
      - main  # or 'master'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install MkDocs Material & Extensions
        run: |
          pip install mkdocs \
                      mkdocs-material \
                      pymdown-extensions

      - name: Prepare Staging Directory & Build mkdocs.yml
        run: |
          python3 -c "
          import os
          import shutil
          import re

          def natural_sort_key(s):
              return [int(text) if text.isdigit() else text.lower() for text in re.split(r'(\d+)', s)]

          # Clean and re-create docs_build folder
          staging_dir = 'docs_build'
          if os.path.exists(staging_dir):
              shutil.rmtree(staging_dir)
          os.makedirs(staging_dir)

          # 1. Copy non-markdown static assets (images, css, code)
          for root, dirs, files in os.walk('.'):
              if any(ignored in root for ignored in ['_site', '.github', '.git', staging_dir]):
                  continue
              for f in files:
                  if not f.endswith('.md'):
                      src = os.path.join(root, f)
                      rel = os.path.relpath(src, '.')
                      dst = os.path.join(staging_dir, rel)
                      os.makedirs(os.path.dirname(dst), exist_ok=True)
                      shutil.copy2(src, dst)

          # 2. Collect and sort all markdown files naturally
          md_files = []
          for root, dirs, files in os.walk('.'):
              if any(ignored in root for ignored in ['_site', '.github', '.git', staging_dir]):
                  continue
              for f in files:
                  if f.endswith('.md') and f.lower() not in ['toc.md', 'readme.md']:
                      rel = os.path.relpath(os.path.join(root, f), '.').replace('\\\\', '/')
                      md_files.append(rel)

          md_files.sort(key=natural_sort_key)

          # 3. Copy markdown files to staging
          if os.path.exists('TOC.md'):
              shutil.copy2('TOC.md', os.path.join(staging_dir, 'index.md'))
          elif os.path.exists('README.md'):
              shutil.copy2('README.md', os.path.join(staging_dir, 'index.md'))

          for f in md_files:
              dst = os.path.join(staging_dir, f)
              os.makedirs(os.path.dirname(dst), exist_ok=True)
              shutil.copy2(f, dst)

          # 4. Generate explicit navigation mapping
          nav_entries = ['  - \"Table of Contents\": \"index.md\"']
          for f in md_files:
              clean_name = os.path.splitext(os.path.basename(f))[0]
              clean_title = re.sub(r'([a-zA-Z]+)(\d+)', r'\1 \2', clean_name).replace('_', ' ').replace('-', ' ').title()
              nav_entries.append(f'  - \"{clean_title}\": \"{f}\"')

          nav_yaml = '\n'.join(nav_entries)

          # Construct configuration without f-string brackets collision
          config_content = (
              'site_name: LPI 701-200 DevOps Tools Engineer Handbook\n'
              'site_description: Comprehensive Enterprise Preparation Guide for LPI 701-200\n'
              'site_author: Madduma Kattadilage Chinthaka Deshapriya Gunadasa\n'
              'site_url: https://chinthakadegunadasa.github.io/lpi-ex701-200-preparation-guide-devops-tools-engineer/\n\n'
              'docs_dir: \"docs_build\"\n'
              'use_directory_urls: false\n\n'
              'theme:\n'
              '  name: material\n'
              '  palette:\n'
              '    - media: \"(prefers-color-scheme: light)\"\n'
              '      scheme: default\n'
              '      primary: indigo\n'
              '      accent: indigo\n'
              '      toggle:\n'
              '        icon: material/brightness-7\n'
              '        name: Switch to dark mode\n'
              '    - media: \"(prefers-color-scheme: dark)\"\n'
              '      scheme: slate\n'
              '      primary: indigo\n'
              '      accent: lime\n'
              '      toggle:\n'
              '        icon: material/brightness-4\n'
              '        name: Switch to light mode\n'
              '  features:\n'
              '    - navigation.instant\n'
              '    - navigation.tracking\n'
              '    - navigation.top\n'
              '    - navigation.tabs\n'
              '    - search.suggest\n'
              '    - search.highlight\n'
              '    - content.code.copy\n\n'
              'markdown_extensions:\n'
              '  - admonition\n'
              '  - pymdownx.superfences\n'
              '  - pymdownx.highlight:\n'
              '      anchor_linenums: true\n'
              '  - pymdownx.inlinehilite\n'
              '  - pymdownx.snippets\n'
              '  - pymdownx.tabbed:\n'
              '      alternate_style: true\n'
              '  - tables\n'
              '  - attr_list\n'
              '  - md_in_html\n\n'
              'nav:\n' + nav_yaml + '\n'
          )

          with open('mkdocs.yml', 'w', encoding='utf-8') as f:
              f.write(config_content)
          "

      - name: Build Site with MkDocs
        run: |
          mkdocs build --site-dir _site

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

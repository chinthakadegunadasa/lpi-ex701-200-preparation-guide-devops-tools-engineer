name: Deploy Markdown Book to GitHub Pages

on:
  push:
    branches:
      - main  # or 'master'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install MkDocs Material & Extensions
        run: |
          pip install mkdocs \
                      mkdocs-material \
                      pymdown-extensions

      - name: Generate mkdocs.yml and Process Natural Chapter Order & Relative Assets
        run: |
          python3 -c "
          import os
          import re

          def natural_sort_key(s):
              # Splits string into integers and non-digits for natural numerical sorting
              return [int(text) if text.isdigit() else text.lower() for text in re.split(r'(\d+)', s)]

          # Collect all chapter markdown files
          md_files = []
          for root, _, files in os.walk('.'):
              # Exclude site output, github actions, and temporary directories
              if any(ignored in root for ignored in ['_site', '.github', '.git', 'site']):
                  continue
              for f in files:
                  if f.endswith('.md') and f.lower() not in ['toc.md', 'readme.md']:
                      rel_path = os.path.relpath(os.path.join(root, f), '.').replace('\\\\', '/')
                      md_files.append(rel_path)

          # Force natural numerical sort on file paths
          md_files.sort(key=natural_sort_key)

          # Construct navigation tree for MkDocs
          nav_entries = []
          if os.path.exists('TOC.md'):
              nav_entries.append('  - \"Table of Contents\": \"TOC.md\"')

          for f in md_files:
              filename = os.path.splitext(os.path.basename(f))[0]
              # Format clean title (e.g. Chapter25 -> Chapter 25)
              clean_title = re.sub(r'([a-zA-Z]+)(\d+)', r'\1 \2', filename).replace('_', ' ').replace('-', ' ').title()
              nav_entries.append(f'  - \"{clean_title}\": \"{f}\"')

          nav_yaml = '\n'.join(nav_entries)

          config_content = f\"\"\"site_name: LPI 701-200 DevOps Tools Engineer Handbook
  site_description: Comprehensive Enterprise Preparation Guide for LPI 701-200
  site_author: Madduma Kattadilage Chinthaka Deshapriya Gunadasa
  site_url: https://chinthakadegunadasa.github.io/lpi-ex701-200-preparation-guide-devops-tools-engineer/

  docs_dir: '.'
  use_directory_urls: false

  theme:
    name: material
    palette:
      - media: \"(prefers-color-scheme: light)\"
        scheme: default
        primary: indigo
        accent: indigo
        toggle:
          icon: material/brightness-7
          name: Switch to dark mode
      - media: \"(prefers-color-scheme: dark)\"
        scheme: slate
        primary: indigo
        accent: lime
        toggle:
          icon: material/brightness-4
          name: Switch to light mode
    features:
      - navigation.instant
      - navigation.tracking
      - navigation.top
      - navigation.tabs
      - navigation.sections
      - search.suggest
      - search.highlight
      - content.code.copy

  markdown_extensions:
    - admonition
    - pymdownx.superfences
    - pymdownx.highlight:
        anchor_linenums: true
    - pymdownx.inlinehilite
    - pymdownx.snippets
    - pymdownx.tabbed:
        alternate_style: true
    - tables
    - attr_list
    - md_in_html

  nav:
  {nav_yaml}
  \"\"\"

          with open('mkdocs.yml', 'w', encoding='utf-8') as f:
              f.write(config_content)
          "

      - name: Build Site with MkDocs
        run: |
          mkdocs build --site-dir _site

      - name: Sync Static Assets and Images into Site Root
        run: |
          # Copy all non-markdown media assets (png, jpg, svg, gif) into the output directory
          rsync -av --include='*/' \
                    --include='*.png' \
                    --include='*.jpg' \
                    --include='*.jpeg' \
                    --include='*.svg' \
                    --include='*.gif' \
                    --exclude='*' \
                    --exclude='.git' \
                    --exclude='.github' \
                    --exclude='_site' \
                    ./ _site/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
